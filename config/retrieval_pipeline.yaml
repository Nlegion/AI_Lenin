retrieval_pipeline:
  enabled: true
  collection_name: "philosophy_ontology_giga_v1"
  qdrant_path: "database/qdrant_local"
  dense_model: "models/Giga-Embeddings-instruct"
  sparse_state_path: ".cursor/artifacts/qdrant/sparse_encoder_state_giga_v1.json"
  ontology_tags_path: ".cursor/artifacts/ontology/ontology_tags.tsv"
  trust_remote_code: true
  device: "auto"
  fallback_to_cpu: true
  expected_dim: 2048
  top_k: 20
  rrf_k: 60
  max_context_chunks: 7
  # Temporarily lighter retrieval for live QA while embeddings share CPU with llama-server.
  hyde_enabled: false
  query_rewrite_enabled: true
  query_decomposition_enabled: false
  judge_enabled: true
  judge_alpha: 0.2
  retriever_weights:
    dense: 1.0
    sparse: 0.8
    onto: 0.6
  source_boosts:
    core_self: 1.5
    influence_agree: 1.2
    influence_critical: 1.0
    contextual: 0.9
  migration:
    mode: "qdrant_only"

dialectical_orchestration:
  enabled: true
  r1_limit: 4
  r2_limit: 3
  r3_limit: 3
  require_r1: true
  fail_on_empty_r1: false
  include_axes_in_query: true
  include_modality_suffix: true
  axes_lemma_enabled: true
  fallback_to_legacy_context: true
  # CPU embeddings while llama-server holds GPU: first encode ~15-20s; wall must cover 3 parallel slots.
  slot_timeout_sec: 45.0
  retrieve_wall_timeout_sec: 90.0
  widen_factor: 3
  max_retries: 2
  r1_modality_suffix: ""  # usually unused for R1
  r2_modality_suffix: "поддержка"
  r3_modality_suffix: "критика"
  short_lead_chars: 200

dialectical_reasoning:
  # legacy | orchestration_single_pass | reasoning_shadow | reasoning_publish
  mode: "orchestration_single_pass"
  kill_switch: false
  fixture_mode: false
  require_orchestration: true
  max_principles: 6
  max_principles_per_slot: 3
  max_quote_chars: 280
  max_causal_links: 3
  max_error_report_chars: 600
  max_rendered_chars: 1800
  max_tokens_out: 512
  ctx_size: 4096
  ctx_margin_ratio: 0.9
  temperature: 0.35
  repair_temperature: 0.1
  repair_max_attempts: 2
  per_pass_timeout_sec: 90.0
  global_timeout_sec: 180.0
  shadow_sample_rate: 0.1
  fallback_to_legacy_on_timeout: false
  judge_sample_rate: 0.0

censorship_experiment:
  duration_hours: 1.5
  poll_seconds: 300
  output_dir: .cursor/artifacts/quality
  jsonl_filename: censorship_90m_latest.jsonl
  csv_filename: censorship_90m_latest.csv
  metrics_filename: censorship_90m_latest.metrics.json
  notes_filename: censorship_90m_latest.notes.md
  seed: 42
  control_jsonl: .cursor/artifacts/quality/censorship_control_set_latest.jsonl
  control_batch_size: 20
  feature_flags:
    sport_block_enabled: true
    l2_similarity_enabled: true
    l3_enabled: false
  anomaly_thresholds:
    review_rate_max_per_hour: 0.2
    timeout_rate_max_per_hour: 0.01


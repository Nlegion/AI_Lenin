news_guard:
  policy_version: "1.0.0"
  input_gate:
    enabled: true
    allow_topics:
      - "экономик"
      - "инфляц"
      - "безработ"
      - "политик"
      - "выбор"
      - "санкц"
      - "империал"
      - "международ"
      - "философ"
      - "идеолог"
      - "истор"
    hard_deny_topics:
      - "спорт"
      - "шоу"
      - "развлеч"
      - "знаменит"
      - "церков"
      - "религиозный обряд"
      - "личная трагедия"
    quarantine_topics:
      - "национальн"
      - "межэтническ"
      - "военный конфликт"
    hard_deny_keywords:
      - "к оружию"
      - "свержение власти"
      - "насильственное изменение конституционного строя"
      - "призыв к восстанию"
    quarantine_keywords:
      - "религиозный конфликт"
      - "экстремистский"
    classify_on_unknown_as: "quarantine"
  output_guard:
    enabled: true
    safe_mode: "strict"
    block_patterns:
      - "(?i)к оружию"
      - "(?i)свержени(е|я) власти"
      - "(?i)насильственн(ый|ого) изменени(е|я)"
      - "(?i)разжиг(ать|ание) .*розн"
      - "(?i)оправдан(ие|о) террор"
    rewrite_patterns:
      - "(?i)уничтожить"
      - "(?i)ликвидировать"
    safe_template: "Данная новость не входит в сферу марксистско-ленинского анализа."
  disclaimer:
    enabled: true
    placement: "footer"
    text: "Данный анализ является компьютерной симуляцией на основе трудов В.И. Ленина в образовательных и исследовательских целях. Он не отражает позицию авторов системы и не является призывом к действию."

censorship_experiment:
  duration_hours: 0.2
  poll_seconds: 300
  output_dir: .cursor/artifacts/quality
  jsonl_filename: censorship_dryrun_short.jsonl
  csv_filename: censorship_dryrun_short.csv
  metrics_filename: censorship_dryrun_short.metrics.json
  notes_filename: censorship_dryrun_short.notes.md
  seed: 42
  min_examples_per_category: 50
  feature_flags:
    sport_block_enabled: true
    l2_similarity_enabled: true
    l3_enabled: false
  anomaly_thresholds:
    review_rate_max_per_hour: 0.2
    timeout_rate_max_per_hour: 0.01

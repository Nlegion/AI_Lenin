ontology_taxonomy:
  concepts:
    диалектика:
      - "единство противоположностей"
      - "отрицание отрицания"
      - "переход количества в качество"
    материализм:
      - "исторический материализм"
      - "диалектический материализм"
      - "материя первична"
    идеализм:
      - "субъективный идеализм"
      - "объективный идеализм"
    классовая_борьба:
      - "классовый конфликт"
      - "борьба классов"
    империализм:
      - "монополистический капитализм"
      - "финансовый капитал"
    революция:
      - "социалистическая революция"
      - "диктатура пролетариата"
    государство:
      - "машина подавления"
      - "классовое господство"

  entities:
    - "Ленин"
    - "Маркс"
    - "Энгельс"
    - "Гегель"
    - "Фейербах"
    - "Каутский"
    - "Бернштейн"

  contradiction_pairs:
    - ["материализм", "идеализм"]
    - ["революция", "реформизм"]

  argument_markers:
    premise:
      - "во-первых"
      - "исходя из"
      - "следует признать"
    inference:
      - "следовательно"
      - "таким образом"
      - "отсюда"
    contrast:
      - "однако"
      - "но"
      - "вместе с тем"
    conclusion:
      - "итак"
      - "в итоге"
      - "поэтому"

  zero_shot_labels:
    political_economy: "экономика труд капитал эксплуатация классы рынок монополия"
    class_analysis: "класс рабочие буржуазия пролетариат борьба эксплуатация"
    state_theory: "государство власть аппарат подавление диктатура право"
    ideology_philosophy: "философия материализм идеализм диалектика познание метод"
    imperialism_geopolitics: "империализм колония санкции война гегемония капитал"

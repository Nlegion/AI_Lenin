safety_gate:
  flags:
    enabled: true
    shadow_mode: true
    enforce_mode: old
    async_shadow: false
    cache_enabled: true
    cache_max_entries: 512
    fallback_to_news_guard_keys: true
  policy:
    policy_version: 1.0.0
    refusal_message: Анализ данной темы невозможен в соответствии с политикой безопасности.
    skip_message: Тема вне сферы марксистско-ленинского анализа новостей.
    classify_on_unknown_as: quarantine
    yellow_warning_text: 'Ограниченный режим анализа: экономические и политические
      отношения без комментариев боевых действий.'
    allow_topics:
    - экономик
    - инфляц
    - безработ
    - политик
    - выбор
    - санкц
    - империал
    - международ
    - философ
    - идеолог
    - истор
    - здравоохран
    - эколог
    - образован
    - страхов
    - транзит
    - инфраструктур
    - железн
    - железнодорож
    - юкжд
    - монопол
    - энерго
    - тариф
    - бюджет
    hard_deny_topics:
    - шоу
    - развлеч
    - знаменит
    - церков
    - религиозный обряд
    - личная трагедия
    quarantine_topics:
    - национальн
    - межэтническ
    - военный конфликт
    hard_deny_keywords:
    - к оружию
    - свержение власти
    - насильственное изменение конституционного строя
    - призыв к восстанию
    quarantine_keywords:
    - религиозный конфликт
    - экстремистский
    military_topics:
    - вооруженные силы рф
    - вооружённые силы рф
    - действия вс рф
    - специальная военная операция
    - сво
    - мобилизация
    - росгвардия
    - министерство обороны
    - боевые действия
    - военный конфликт с участием рф
    - оборона рф
    public_interest_topics:
    - правительств
    - президент
    - госдум
    - министерств
    - экономик
    - публичн
    - политик
    - цик
    - выбор
    - голосован
    - фестивал
    - молодеж
    - посольств
    - мид
    - депутат
    - сенатор
    - губернатор
    - посол
    economy_policy_markers:
    - экономик
    - страхов
    - инфляц
    - безработ
    - санкц
    - торговл
    - экспорт
    - транзит
    - инфраструктур
    - железн
    - железнодорож
    - юкжд
    - монопол
    - энерго
    - тариф
    - бюджет
    - зарплат
    - забастовк
    - профсоюз
    yellow_block_patterns:
    - (?i)перемещен(ие|ия)\s+войск
    - (?i)тактик(а|и|е)\s+(удара|наступлен)
    - (?i)потери\s+(личного\s+состава|всу|вс\s*рф)
    - (?i)к\s+оружию
    - (?i)оправдан(ие|о)\s+террор
    block_private_pii: true
  censorship_runtime:
    min_chars: 24
    ru_ratio_threshold: 0.60
    non_ru_mode: skip_non_ru
    duplicate_ttl_seconds: 86400
    duplicate_cache_size: 100000
    sport_block_enabled: true
    l2_similarity_enabled: true
    l2_review_threshold: 0.72
    l2_hard_block_threshold: 0.92
    l2_latency_budget_ms: 20.0
    l2_text_max_chars: 1200
    l2_cache_size: 4096
    l3_enabled: false
    l3_timeout_seconds: 2.0
    l3_retry_count: 1
    l3_circuit_open_seconds: 120.0
    fallback_to_review: true
    unknown_topic_to_skip_enabled: true
    unknown_low_signal_l2_max: 0.25
    airport_operational_whitelist_enabled: true
    sanctions_allow_l2_min: 0.60
    require_l3_for_sanctions_allow: false
    sensitive_topic_guard_enabled: true
    war_review_threshold: 0.50
    war_hard_block_threshold: 0.80
    l2_model_version: rubert-tiny2-v1
    cache_cleanup_interval_seconds: 3600
    cache_ttl_seconds: 86400

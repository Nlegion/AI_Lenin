safety_gate:
  flags:
    enabled: true
    shadow_mode: true
    enforce_mode: old
    async_shadow: false
    cache_enabled: true
    cache_max_entries: 512
    fallback_to_news_guard_keys: true
  policy:
    policy_version: 1.0.0
    refusal_message: Анализ данной темы невозможен в соответствии с политикой безопасности.
    skip_message: Тема вне сферы марксистско-ленинского анализа новостей.
    classify_on_unknown_as: quarantine
    yellow_warning_text: 'Ограниченный режим анализа: экономические и политические
      отношения без комментариев боевых действий.'
    allow_topics:
    - экономик
    - инфляц
    - безработ
    - политик
    - выбор
    - санкц
    - империал
    - международ
    - философ
    - идеолог
    - истор
    - здравоохран
    - эколог
    - образован
    - страхов
    - транзит
    - инфраструктур
    - железн
    - железнодорож
    - юкжд
    - монопол
    - энерго
    - тариф
    - бюджет
    hard_deny_topics:
    - шоу
    - развлеч
    - знаменит
    - церков
    - религиозный обряд
    - личная трагедия
    quarantine_topics:
    - национальн
    - межэтническ
    - военный конфликт
    hard_deny_keywords:
    - к оружию
    - свержение власти
    - насильственное изменение конституционного строя
    - призыв к восстанию
    quarantine_keywords:
    - религиозный конфликт
    - экстремистский
    military_topics:
    - вооруженные силы рф
    - вооружённые силы рф
    - действия вс рф
    - специальная военная операция
    - сво
    - мобилизация
    - росгвардия
    - министерство обороны
    - боевые действия
    - военный конфликт с участием рф
    - оборона рф
    public_interest_topics:
    - правительств
    - президент
    - госдум
    - министерств
    - экономик
    - публичн
    - политик
    - цик
    - выбор
    - голосован
    - фестивал
    - молодеж
    - посольств
    - мид
    - депутат
    - сенатор
    - губернатор
    - посол
    economy_policy_markers:
    - экономик
    - страхов
    - инфляц
    - безработ
    - санкц
    - торговл
    - экспорт
    - транзит
    - инфраструктур
    - железн
    - железнодорож
    - юкжд
    - монопол
    - энерго
    - тариф
    - бюджет
    - зарплат
    - забастовк
    - профсоюз
    yellow_block_patterns:
    - (?i)перемещен(ие|ия)\s+войск
    - (?i)тактик(а|и|е)\s+(удара|наступлен)
    - (?i)потери\s+(личного\s+состава|всу|вс\s*рф)
    - (?i)к\s+оружию
    - (?i)оправдан(ие|о)\s+террор
    block_private_pii: true

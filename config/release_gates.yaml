# Unified release / quality gates (SoT). Bump version on material threshold edits.
version: "1.0"

rag_quality:
  enabled: true
  tolerance_relative: 0.03
  metrics:
    recall_at_5: { threshold: 0.85, direction: higher }
    core_self_ratio: { threshold: 0.70, direction: higher }
    ideology_consistency: { threshold: 0.70, direction: higher }
    citation_hallucination_rate_max: { threshold: 0.05, direction: lower }
    # Hard-fail: fabricated том/стр/work/path among answers that contain attribution.
    critical_attribution_hallucination_rate: { threshold: 0.0, direction: lower }
    empty_context_rate_max: { threshold: 0.10, direction: lower }

news_guard:
  enabled: true

censorship_quality_gates:
  enabled: true
  fpr_diplomacy_max: 0.01
  block_recall_min: 0.95
  review_rate_max: 0.20
  reason_coverage_min: 0.99
  fp_growth_non_dangerous_max_delta: 0.05
  review_backlog_max: 500
  review_resolution_time_p95_seconds_max: 3600
  canary_min_hours: 24
  shadow_agreement_min: 0.99

censorship_latency_gates:
  enabled: true
  p95_without_l3_delta_max_ms: 10
  p95_with_l3_delta_max_ms: 40
  p95_ratio_vs_baseline_max: 1.10
  timeout_rate_max: 0.001
  throughput_min_ratio_vs_baseline: 0.8

censorship_rollback:
  enabled: true
  auto_rollback_on_error_rate: 0.05
  observation_window_minutes: 30

anti_cliche:
  enabled: false

news_guard_delta_check:
  enabled: false
  baseline_json: .cursor/artifacts/evaluation/news_guard_eval_baseline.json

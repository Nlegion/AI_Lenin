cleaning:
  remove_line_patterns:
    - "^\\s*Тираж.*$"
    - "^\\s*Цена.*$"
    - "^\\s*ISBN.*$"
    - "^\\s*Подписано к печати.*$"
    - "^\\s*Сдано в набор.*$"
    - "^\\s*Редактор.*$"
    - "^\\s*©.*$"
    - "^\\s*МОСКВА\\s*\\d{4}.*$"
    - "^\\s*Пролетарии всех стран, соединяйтесь!?\\s*$"
    - "^\\s*(Том|том)\\s*\\d+\\s*$"
    - "^\\s*(стр\\.|с\\.)\\s*\\d+\\s*$"
  remove_inline_patterns:
    - "\\b(стр\\.|с\\.)\\s*\\d+\\b"
    - "\\b(Том|том)\\s*\\d+\\b"
    - "\\bISBN\\s*[:0-9X\\- ]+\\b"
    - "\\bПЕЧАТАЕТСЯ ПО ПОСТАНОВЛЕНИЮ\\b"
    - "\\bИНСТИТУТ МАРКСИЗМА-ЛЕНИНИЗМА\\b"
  content_start_markers:
    - "^ГЛАВА\\s+\\d+"
    - "^РАЗДЕЛ\\s+\\d+"
    - "^ЧАСТЬ\\s+\\d+"
    - "^§\\s*\\d+"
    - "^ВВЕДЕНИЕ"
    - "^ПРЕДИСЛОВИЕ"
  min_cleaned_chars: 600
  min_semantic_paragraph_chars: 120
  semantic_overlap_threshold: 0.40
  validation_sample_size: 25
  max_semantic_damage_ratio: 0.02

      role: production_target
      notes: "Load from local_path offline; hf_id is provenance only."
    retired_baseline:
      name: "legacy_sentence_transformer_baseline"
      trust_remote_code: false
      role: removed_from_runtime
    candidates:
      - name: "BAAI/bge-m3"

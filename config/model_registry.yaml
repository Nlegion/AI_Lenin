model_registry:
  version: "1.0.0"
  generation:
    base_strong:
      role: primary
      provider: llama_cpp
      model_name: "ai-sage/GigaChat3-10B-A1.8B"
      model_path: "models/gigachat3/GigaChat3-10B-A1.8B-q6_k.gguf"
      source_path_hint: "P:/hometest_GigaChat3/data/model/GigaChat3-10B-A1.8B-q6_k.gguf"
      api_style: chat_completions
      notes: "Default runtime generator with RAG context."
